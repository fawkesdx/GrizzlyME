[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grizzlyme"
version = "0.1.2"
description = "GPU-accelerated batched matrix elements for chinook ARPES simulations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GrizzlyME contributors" }]
keywords = ["arpes", "chinook", "pytorch", "tight-binding", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "psutil>=5.8",
    "torch>=2.0",
    "chinook>=1.1.3",
    # chinook.atomic_mass imports pkg_resources; removed from setuptools>=82
    "setuptools>=61,<82",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mkdocs>=1.5", "mkdocs-material>=9.0"]
bench = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/fawkesdx/GrizzlyME"
Documentation = "https://fawkesdx.github.io/GrizzlyME/"
Source = "https://github.com/fawkesdx/GrizzlyME"
Issues = "https://github.com/fawkesdx/GrizzlyME/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["grizzly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*"]
