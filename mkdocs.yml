site_name: GrizzlyME
site_description: GPU-accelerated matrix elements for chinook ARPES
site_url: https://fawkesdx.github.io/GrizzlyME/
repo_url: https://github.com/fawkesdx/GrizzlyME
repo_name: fawkesdx/GrizzlyME
docs_dir: website

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Scope & limits: limits.md
  - Name & branding: naming.md
  - Vision & roadmap: roadmap.md
  - Performance: performance.md
  - API: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
