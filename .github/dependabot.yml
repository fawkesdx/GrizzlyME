version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # chinook.atomic_mass imports pkg_resources, which setuptools removed in 82.
      # Keep the <82 pin until chinook drops pkg_resources.
      - dependency-name: setuptools
        versions: [">=82"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
